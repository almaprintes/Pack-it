<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PACK IT!</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;font-family:system-ui;background:#f8efdf;color:#3c2b20}.game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#fbf4e6 0 64%,#deb88e 64%)}header{padding:55px 25px;display:flex;justify-content:space-between;font-weight:900;font-size:25px}.box{position:absolute;left:8%;top:22%;width:84%;height:38%;background:#bf7d4c;border:12px solid #8f5733;border-radius:18px;box-shadow:inset 0 0 0 5px #dfa675,0 22px 35px #54341d33}.tray{position:absolute;inset:auto 0 5% 0;height:28%}.item{position:absolute;display:grid;place-items:center;border-radius:14px;filter:drop-shadow(0 8px 5px #432b1c44);transition:transform .15s}.item.drag{transform:scale(1.08)}.book{background:linear-gradient(90deg,#92251f 8%,#d84b40 9% 88%,#f2d5ae 89% 94%,#7c201d 95%);border:3px solid #72211e}.book:after{content:'VOL.1';font:900 11px Georgia}.shirt{background:linear-gradient(145deg,#82c5ef,#3989c3);clip-path:polygon(25% 8%,40% 0,50% 10%,60% 0,75% 8%,100% 28%,84% 45%,72% 35%,72% 100%,28% 100%,28% 35%,16% 45%,0 28%)}.shoe{background:linear-gradient(#faf9f3 55%,#d7d6cf 56% 75%,#4e78a6 76%);border-radius:55% 25% 18% 25%}.mug{background:#f3d59b}.camera{background:#30363a}.rotate{position:absolute;bottom:32%;left:50%;transform:translateX(-50%);border:0;border-radius:22px;padding:12px 20px;background:white;font-weight:900;display:none}.rotate.show{display:block}.hint{position:absolute;bottom:2%;width:100%;text-align:center;font-weight:800;opacity:.5}.win{position:absolute;top:15%;width:100%;text-align:center;font-size:25px;font-weight:1000;opacity:0}.win.show{opacity:1}.next{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);padding:14px 24px;border:0;border-radius:22px;background:#3c2b20;color:white;font-weight:900;display:none}.next.show{display:block}.version{position:absolute;right:8px;bottom:5px;font-size:10px;opacity:.35}</style></head><body><main class="game"><header><span>PACK IT! 📦</span><span>Caja <b id="lv">1</b>/5</span></header><div id="box" class="box"></div><div id="tray" class="tray"></div><button id="rotate" class="rotate">↻ Girar objeto</button><div class="hint">Haz que todo quepa · sin solapar</div><div id="win" class="win">✨ PERFECT PACK!</div><button id="next" class="next">Siguiente caja →</button><div class="version">DEV 0.0.4</div></main><script>const levels=[[['book',76,112],['shirt',116,78]],[['book',82,120],['shoe',150,70]],[['book',78,116],['shirt',116,76],['mug',70,70]],[['shoe',155,68],['book',82,122],['camera',96,74]],[['book',78,118],['shirt',120,76],['camera',94,72],['mug',66,66]]];let level=0,sel=null;const box=document.querySelector('#box'),tray=document.querySelector('#tray'),rot=document.querySelector('#rotate'),win=document.querySelector('#win'),next=document.querySelector('#next'),lv=document.querySelector('#lv');function load(){tray.innerHTML='';box.innerHTML='';win.classList.remove('show');next.classList.remove('show');rot.classList.remove('show');lv.textContent=level+1;levels[level].forEach((o,i)=>{let e=document.createElement('div');e.className='item '+o[0];e.style.width=o[1]+'px';e.style.height=o[2]+'px';e.style.left=(6+i*25)+'%';e.style.top=(15+(i%2)*35)+'%';tray.appendChild(e);drag(e)})}function overlap(a,b){return !(a.right<=b.left+3||a.left>=b.right-3||a.bottom<=b.top+3||a.top>=b.bottom-3)}function valid(e){let r=e.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.left<b.left+15||r.right>b.right-15||r.top<b.top+15||r.bottom>b.bottom-15)return false;return ![...box.querySelectorAll('.item')].some(x=>x!==e&&overlap(r,x.getBoundingClientRect()))}function drag(e){let active=false,dx=0,dy=0,home;e.onpointerdown=p=>{sel=e;rot.classList.add('show');active=true;e.setPointerCapture(p.pointerId);let r=e.getBoundingClientRect();dx=p.clientX-r.left;dy=p.clientY-r.top;home={parent:e.parentNode,left:e.style.left,top:e.style.top};e.classList.add('drag');e.style.position='fixed';e.style.zIndex=20};e.onpointermove=p=>{if(active){e.style.left=p.clientX-dx+'px';e.style.top=p.clientY-dy+'px'}};e.onpointerup=()=>{if(!active)return;active=false;e.classList.remove('drag');if(valid(e)){let r=e.getBoundingClientRect(),b=box.getBoundingClientRect();box.appendChild(e);e.style.position='absolute';e.style.left=r.left-b.left-box.clientLeft+'px';e.style.top=r.top-b.top-box.clientTop+'px';e.style.zIndex=2;if(navigator.vibrate)navigator.vibrate(30);check()}else{home.parent.appendChild(e);e.style.position='absolute';e.style.left=home.left;e.style.top=home.top;e.style.zIndex='';if(navigator.vibrate)navigator.vibrate(8)}}}rot.onclick=()=>{if(!sel)return;let w=sel.offsetWidth,h=sel.offsetHeight;sel.style.width=h+'px';sel.style.height=w+'px';check()};function check(){let all=[...document.querySelectorAll('.item')];if(all.length&&all.every(e=>e.parentNode===box&&valid(e))){win.classList.add('show');next.classList.add('show');rot.classList.remove('show');if(navigator.vibrate)navigator.vibrate([25,30,55])}}next.onclick=()=>{level=(level+1)%levels.length;load()};load()</script></body></html>
