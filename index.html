<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PACK IT!</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded",sans-serif;background:#efe3cc;color:#403126}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:linear-gradient(#f8eedc 0 62%,#d9b58c 62%)}header{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;font-size:27px;letter-spacing:-1px}.level{background:#fff9;padding:8px 13px;border-radius:20px;font-weight:800}.box{position:absolute;left:12%;top:22%;width:76%;height:35%;background:#bd8151;border:10px solid #98613a;border-radius:12px;box-shadow:inset 0 0 0 4px #dca777,0 18px 30px #6e48262b}.box:before,.box:after{content:"";position:absolute;top:-25px;width:46%;height:18px;background:#d69b68;border:4px solid #a86d43}.box:before{left:0;transform:skewX(12deg)}.box:after{right:0;transform:skewX(-12deg)}.tray{position:absolute;left:0;right:0;bottom:4%;height:31%}.item{position:absolute;display:grid;place-items:center;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 7px 5px #4d321d35);font-size:52px;border-radius:16px;cursor:grab;transition:filter .12s,transform .12s}.item.drag{filter:drop-shadow(0 14px 8px #4d321d45);transform:scale(1.07)}.item.placed{filter:drop-shadow(0 4px 3px #4d321d25)}.hint{position:absolute;bottom:1.5%;left:0;right:0;text-align:center;font-size:13px;font-weight:700;opacity:.55}.win{position:absolute;z-index:20;inset:0;background:#fff2;backdrop-filter:blur(4px);display:none;place-items:center}.win.show{display:grid}.card{background:#fff;border-radius:28px;padding:26px 34px;text-align:center;box-shadow:0 18px 50px #57391e38;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}.card b{font-size:32px;display:block}.card span{font-size:44px}.card button{border:0;background:#403126;color:white;padding:13px 24px;border-radius:18px;font-weight:900;font-size:17px;margin-top:12px}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.version{position:absolute;right:8px;bottom:5px;font-size:10px;opacity:.35}
</style></head>
<body><main class="game"><header><div class="logo">PACK IT! 📦</div><div class="level">Caja <span id="lv">1</span>/5</div></header><div id="box" class="box"></div><div id="tray" class="tray"></div><div class="hint">Arrastra los objetos dentro de la caja</div><div id="win" class="win"><div class="card"><span>✨</span><b>PERFECT PACK!</b><p>Todo encaja.</p><button id="next">Siguiente caja</button></div></div><div class="version">DEV 0.0.1</div></main>
<script>
const levels=[
 [{e:'📕',w:82,h:104},{e:'👕',w:105,h:82}],
 [{e:'🎧',w:92,h:92},{e:'👟',w:130,h:70}],
 [{e:'📷',w:92,h:78},{e:'📘',w:76,h:104},{e:'☕',w:72,h:72}],
 [{e:'👟',w:128,h:68},{e:'👕',w:102,h:80},{e:'🎧',w:86,h:86}],
 [{e:'📗',w:70,h:110},{e:'📷',w:94,h:76},{e:'☕',w:70,h:70}]
];let level=0,placed=0;const box=document.querySelector('#box'),tray=document.querySelector('#tray'),win=document.querySelector('#win'),lv=document.querySelector('#lv');
function load(){tray.innerHTML='';win.classList.remove('show');placed=0;lv.textContent=level+1;const items=levels[level];items.forEach((o,i)=>{let el=document.createElement('div');el.className='item';el.textContent=o.e;el.style.width=o.w+'px';el.style.height=o.h+'px';el.style.left=(8+i*(82/items.length))+'%';el.style.top=(20+(i%2)*25)+'%';tray.appendChild(el);drag(el)});}
function drag(el){let dx=0,dy=0,active=false;el.addEventListener('pointerdown',e=>{if(el.classList.contains('placed'))return;active=true;el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;el.classList.add('drag');el.style.position='fixed';el.style.zIndex=10;move(e)});el.addEventListener('pointermove',e=>{if(active)move(e)});el.addEventListener('pointerup',e=>{if(!active)return;active=false;el.classList.remove('drag');let r=el.getBoundingClientRect(),b=box.getBoundingClientRect();let inside=r.left>=b.left+8&&r.right<=b.right-8&&r.top>=b.top+8&&r.bottom<=b.bottom-8;if(inside){el.classList.add('placed');el.style.zIndex=3;placed++;if(navigator.vibrate)navigator.vibrate(25);setTimeout(()=>{if(placed===levels[level].length)win.classList.add('show')},220)}else{load()}});function move(e){el.style.left=(e.clientX-dx)+'px';el.style.top=(e.clientY-dy)+'px'}}
document.querySelector('#next').onclick=()=>{level=(level+1)%levels.length;load()};load();
</script></body></html>
