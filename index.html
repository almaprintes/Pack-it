<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PACK IT!</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;font-family:system-ui;background:#f8efdf;color:#3c2b20}.game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#fbf4e6 0 64%,#deb88e 64%)}header{padding:55px 25px;display:flex;justify-content:space-between;font-weight:900;font-size:25px}.boxwrap{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:min(96vw,500px);aspect-ratio:1}.boxart{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 18px #54341d25);pointer-events:none}.box{position:absolute;left:23.5%;top:30%;width:53%;height:39%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);background-image:linear-gradient(to right,#fff2 1px,transparent 1px),linear-gradient(to bottom,#fff2 1px,transparent 1px);background-size:12.5% 100%,100% 16.666%;overflow:visible}.tray{position:absolute;inset:auto 0 4% 0;height:27%}.item{position:absolute;display:grid;place-items:center;border-radius:12px;filter:drop-shadow(0 7px 5px #432b1c44);transition:transform .12s,left .12s,top .12s}.item.drag{transform:scale(1.06);transition:transform .08s}.item.invalid{animation:shake .2s}.book{background:linear-gradient(90deg,#92251f 8%,#d84b40 9% 88%,#f2d5ae 89% 94%,#7c201d 95%);border:3px solid #72211e}.book:after{content:'VOL.1';font:900 11px Georgia}.folded{background:linear-gradient(145deg,#8ac9ef,#438fc5);border:3px solid #347baa;box-shadow:inset 0 9px #ffffff25,inset -7px -6px #266d9b22}.folded:after{content:'•••';color:#d8effb;letter-spacing:5px;font-weight:900}.shoe{background:linear-gradient(#faf9f3 55%,#d7d6cf 56% 75%,#4e78a6 76%);border-radius:50% 25% 18% 28%;border:2px solid #aaa}.mug{background:linear-gradient(90deg,#e9c787,#ffe6ae);border:3px solid #caa66c}.mug:after{content:'';position:absolute;right:-10%;width:28%;height:44%;border:5px solid #d6b474;border-left:0;border-radius:0 14px 14px 0}.camera{background:linear-gradient(#474d51,#24292c);border:3px solid #181c1e}.camera:after{content:'';width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#a9d4e4 0 18%,#34515d 20% 48%,#111 50%);border:4px solid #62696d}.rotate{position:absolute;bottom:31%;left:50%;transform:translateX(-50%);border:0;border-radius:22px;padding:12px 20px;background:white;font-weight:900;display:none;box-shadow:0 8px 20px #54341d22}.rotate.show{display:block}.hint{position:absolute;bottom:2%;width:100%;text-align:center;font-weight:800;opacity:.5}.win{position:absolute;top:14%;width:100%;text-align:center;font-size:25px;font-weight:1000;opacity:0}.win.show{opacity:1}.next{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);padding:14px 24px;border:0;border-radius:22px;background:#3c2b20;color:white;font-weight:900;display:none}.next.show{display:block}.version{position:absolute;right:8px;bottom:5px;font-size:10px;opacity:.35}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body><main class="game"><header><span>PACK IT! 📦</span><span>Caja <b id="lv">1</b>/5</span></header><div class="boxwrap"><img class="boxart" src="assets/boxes/box-open.webp" alt=""><div id="box" class="box"></div></div><div id="tray" class="tray"></div><button id="rotate" class="rotate">↻ Girar objeto</button><div class="hint">Encaja las piezas · puedes sacarlas y recolocarlas</div><div id="win" class="win">✨ PERFECT PACK!</div><button id="next" class="next">Siguiente caja →</button><div class="version">DEV 0.0.8</div></main><script>
const ROWS=6,COLS=8;
const catalog={book:{c:'book',shape:[[1,1],[1,1],[1,1]]},folded:{c:'folded',shape:[[1,1,1],[1,1,1]]},shoe:{c:'shoe',shape:[[1,1,1,1],[0,1,1,1]]},mug:{c:'mug',shape:[[1,1],[1,1],[1,0]]},camera:{c:'camera',shape:[[1,1,1],[1,1,1]]}};
const levels=[['book','folded'],['book','shoe'],['book','folded','mug'],['shoe','book','camera'],['book','folded','camera','mug']];
let level=0,selected=null,idSeq=0;const box=document.querySelector('#box'),tray=document.querySelector('#tray'),rot=document.querySelector('#rotate'),win=document.querySelector('#win'),next=document.querySelector('#next'),lv=document.querySelector('#lv');
const rotateShape=s=>{const h=s.length,w=s[0].length,r=Array.from({length:w},()=>Array(h).fill(0));for(let y=0;y<h;y++)for(let x=0;x<w;x++)r[x][h-1-y]=s[y][x];return r};
function occupied(except){const out=new Set();[...box.querySelectorAll('.item')].forEach(e=>{if(e===except)return;const st=e._st;if(st.row==null)return;cells(st.shape,st.row,st.col).forEach(([r,c])=>out.add(r+','+c))});return out}
function cells(shape,row,col){let a=[];shape.forEach((rr,y)=>rr.forEach((v,x)=>{if(v)a.push([row+y,col+x])}));return a}
function canPlace(e,row,col,shape=e._st.shape){const occ=occupied(e);return cells(shape,row,col).every(([r,c])=>r>=0&&r<ROWS&&c>=0&&c<COLS&&!occ.has(r+','+c))}
function sizeItem(e){const s=e._st.shape,b=box.getBoundingClientRect(),cw=b.width/COLS,ch=b.height/ROWS;e.style.width=(s[0].length*cw)+'px';e.style.height=(s.length*ch)+'px'}
function positionItem(e){const st=e._st,b=box.getBoundingClientRect(),cw=b.width/COLS,ch=b.height/ROWS;sizeItem(e);e.style.left=(st.col*cw)+'px';e.style.top=(st.row*ch)+'px'}
function trayPosition(e){const i=Number(e.dataset.slot)||0;e.style.left=(5+i*(88/levels[level].length))+'%';e.style.top=(8+(i%2)*44)+'%'}
function sendToTray(e){e._st.row=null;e._st.col=null;tray.appendChild(e);e.style.position='absolute';e.style.zIndex='';trayPosition(e);sizeItem(e);win.classList.remove('show');next.classList.remove('show')}
function load(){tray.innerHTML='';box.innerHTML='';win.classList.remove('show');next.classList.remove('show');rot.classList.remove('show');selected=null;lv.textContent=level+1;levels[level].forEach((name,i)=>{let o=catalog[name],e=document.createElement('div');e.className='item '+o.c;e.dataset.slot=i;e._st={id:++idSeq,name,shape:o.shape.map(r=>r.slice()),row:null,col:null};tray.appendChild(e);trayPosition(e);setTimeout(()=>sizeItem(e),0);drag(e)})}
function drag(e){let active=false,dx=0,dy=0,origin=null;e.addEventListener('pointerdown',p=>{selected=e;rot.classList.add('show');active=true;e.setPointerCapture(p.pointerId);const r=e.getBoundingClientRect();dx=p.clientX-r.left;dy=p.clientY-r.top;origin={parent:e.parentNode,row:e._st.row,col:e._st.col,left:e.style.left,top:e.style.top};e.classList.add('drag');e.style.position='fixed';e.style.left=r.left+'px';e.style.top=r.top+'px';e.style.zIndex=30});e.addEventListener('pointermove',p=>{if(active){e.style.left=(p.clientX-dx)+'px';e.style.top=(p.clientY-dy)+'px'}});e.addEventListener('pointerup',()=>{if(!active)return;active=false;e.classList.remove('drag');const r=e.getBoundingClientRect(),b=box.getBoundingClientRect(),t=tray.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const overTray=cx>=t.left&&cx<=t.right&&cy>=t.top&&cy<=t.bottom;if(overTray){sendToTray(e);if(navigator.vibrate)navigator.vibrate(18);return}const cw=b.width/COLS,ch=b.height/ROWS,col=Math.round((r.left-b.left)/cw),row=Math.round((r.top-b.top)/ch);if(canPlace(e,row,col)){box.appendChild(e);e._st.row=row;e._st.col=col;e.style.position='absolute';e.style.zIndex=5;positionItem(e);if(navigator.vibrate)navigator.vibrate(25);check()}else{restore(e,origin)}})}
function restore(e,o){e._st.row=o.row;e._st.col=o.col;o.parent.appendChild(e);e.style.position='absolute';e.style.zIndex='';if(o.parent===box){positionItem(e)}else{e.style.left=o.left;e.style.top=o.top;sizeItem(e)}e.classList.remove('invalid');void e.offsetWidth;e.classList.add('invalid');if(navigator.vibrate)navigator.vibrate(8)}
rot.addEventListener('click',()=>{if(!selected)return;const ns=rotateShape(selected._st.shape);if(selected.parentNode===box){const {row,col}=selected._st;if(!canPlace(selected,row,col,ns)){selected.classList.remove('invalid');void selected.offsetWidth;selected.classList.add('invalid');if(navigator.vibrate)navigator.vibrate(12);return}}selected._st.shape=ns;if(selected.parentNode===box)positionItem(selected);else sizeItem(selected);if(navigator.vibrate)navigator.vibrate(18);check()});
function check(){const all=[...document.querySelectorAll('.item')];if(all.length&&all.every(e=>e.parentNode===box)){win.classList.add('show');next.classList.add('show');rot.classList.remove('show');if(navigator.vibrate)navigator.vibrate([25,30,55])}}
next.addEventListener('click',()=>{level=(level+1)%levels.length;load()});window.addEventListener('resize',()=>[...document.querySelectorAll('.item')].forEach(e=>e.parentNode===box?positionItem(e):sizeItem(e)));load();
</script></body></html>
