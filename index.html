<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PACK IT!</title>
<style id="boot-style">html,body{margin:0;background:#111}body{visibility:hidden}</style>
</head>
<body>
<div id="splash" class="splash"><div class="splash-card"><div class="splash-box">📦</div><div class="splash-title">PACK IT!</div><div class="splash-tag">ORDENA · ENCAJA · ENVÍA</div><button id="startGame" class="splash-start">EMPEZAR</button></div><div class="splash-version"></div></div>
<main class="game"><header><span>PACK IT! 📦</span><span>Caja <b id="lv">1</b>/5</span></header><div id="conveyor" class="conveyor"><div class="belt"><div id="rollers" class="rollers"></div><div class="railmark"></div></div></div><div id="boxwrap" class="boxwrap"><img class="boxart" data-src="assets/boxes/box-open.webp" alt=""><div id="box" class="box"></div><img class="boxclosed" data-src="assets/boxes/box-closed.webp" alt=""><div class="packtape"><span>PACK IT! 📦 · PACK IT! 📦 · PACK IT! 📦 · PACK IT! 📦</span></div><div id="smoke" class="smoke"><i class="puff" style="--x:-105px;--y:-42px;--d:0s"></i><i class="puff" style="--x:-58px;--y:-90px;--d:.03s"></i><i class="puff" style="--x:8px;--y:-108px;--d:.05s"></i><i class="puff" style="--x:76px;--y:-78px;--d:.02s"></i><i class="puff" style="--x:112px;--y:-18px;--d:.06s"></i><i class="puff" style="--x:91px;--y:58px;--d:.04s"></i><i class="puff" style="--x:28px;--y:94px;--d:0s"></i><i class="puff" style="--x:-45px;--y:88px;--d:.05s"></i><i class="puff" style="--x:-103px;--y:42px;--d:.02s"></i><i class="puff" style="--x:0px;--y:0px;--d:0s"></i></div></div><div id="tray" class="tray"></div><div class="actions"><button id="rotate" class="rotate">↻ Girar</button><button id="prepare" class="prepare">Preparar</button></div><div class="hint">Arrastra desde abajo · toca una pieza colocada para retirarla</div><div id="win" class="win">✨ PERFECT PACK!</div><button id="next" class="next">Siguiente caja →</button><div class="version"></div></main>
<script>
(async()=>{
  try{
    const r=await fetch(`assets/js/version.js?_=${Date.now()}`,{cache:'no-store'});
    (0,eval)(await r.text());
    const b=window.PACKIT_BUILD,v=window.PACKIT_VERSION;
    document.querySelectorAll('.version,.splash-version').forEach(e=>e.textContent=v);
    const css=document.createElement('link');
    css.rel='stylesheet';
    css.href=`assets/css/game.css?v=${b}`;
    const cssReady=new Promise((ok,fail)=>{css.onload=ok;css.onerror=fail});
    document.head.appendChild(css);
    document.querySelectorAll('[data-src]').forEach(e=>e.src=`${e.dataset.src}?v=${b}`);
    const load=src=>new Promise((ok,fail)=>{const s=document.createElement('script');s.src=`${src}?v=${b}`;s.onload=ok;s.onerror=fail;document.body.appendChild(s)});
    await cssReady;
    await load('assets/js/game.js');
    await load('assets/js/cable-fit.js');
    await load('assets/audio/audio.js');
    document.body.style.visibility='visible';
    document.querySelector('#boot-style')?.remove();
  }catch(e){
    document.body.style.visibility='visible';
    document.body.innerHTML='<p style="font:16px system-ui;padding:24px;color:white;background:#111;margin:0;min-height:100vh">No se pudo cargar PACK IT!. Recarga la página.</p>';
  }
})();
</script>
</body>
</html>
