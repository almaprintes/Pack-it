<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PACK IT!</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded",sans-serif;background:#efe3cc;color:#403126}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:linear-gradient(#f8eedc 0 62%,#d9b58c 62%)}header{position:absolute;z-index:5;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;font-size:27px;letter-spacing:-1px}.level{background:#fff9;padding:8px 13px;border-radius:20px;font-weight:800}.box{position:absolute;left:12%;top:22%;width:76%;height:35%;background:#bd8151;border:10px solid #98613a;border-radius:12px;box-shadow:inset 0 0 0 4px #dca777,0 18px 30px #6e48262b}.box:before,.box:after{content:"";position:absolute;top:-25px;width:46%;height:18px;background:#d69b68;border:4px solid #a86d43}.box:before{left:0;transform:skewX(12deg)}.box:after{right:0;transform:skewX(-12deg)}.slot{position:absolute;border:2px dashed #fff4;border-radius:16px;background:#fff1;transition:.15s}.slot.hot{border-color:#fff9;background:#fff2;transform:scale(1.03)}.tray{position:absolute;left:0;right:0;bottom:4%;height:31%}.item{position:absolute;display:grid;place-items:center;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 7px 5px #4d321d35);font-size:52px;border-radius:16px;cursor:grab;transition:filter .12s,transform .12s,left .18s ease,top .18s ease}.item.drag{filter:drop-shadow(0 14px 8px #4d321d45);transform:scale(1.07);transition:filter .12s,transform .12s}.item.placed{filter:drop-shadow(0 4px 3px #4d321d25);transform:scale(.98)}.hint{position:absolute;bottom:1.5%;left:0;right:0;text-align:center;font-size:13px;font-weight:700;opacity:.55}.win{position:absolute;z-index:20;inset:0;background:#fff2;backdrop-filter:blur(4px);display:none;place-items:center}.win.show{display:grid}.card{background:#fff;border-radius:28px;padding:26px 34px;text-align:center;box-shadow:0 18px 50px #57391e38;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}.card b{font-size:32px;display:block}.card span{font-size:44px}.card button{border:0;background:#403126;color:white;padding:13px 24px;border-radius:18px;font-weight:900;font-size:17px;margin-top:12px}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}.version{position:absolute;right:8px;bottom:5px;font-size:10px;opacity:.35}
</style></head>
<body><main class="game"><header><div class="logo">PACK IT! 📦</div><div class="level">Caja <span id="lv">1</span>/5</div></header><div id="box" class="box"></div><div id="tray" class="tray"></div><div class="hint">Encuentra dónde encaja cada objeto</div><div id="win" class="win"><div class="card"><span>✨</span><b>PERFECT PACK!</b><p>Todo encaja.</p><button id="next">Siguiente caja</button></div></div><div class="version">DEV 0.0.2</div></main>
<script>
const levels=[
 [{e:'📕',w:82,h:104,x:8,y:18},{e:'👕',w:105,h:82,x:56,y:48}],
 [{e:'🎧',w:92,h:92,x:8,y:48},{e:'👟',w:130,h:70,x:48,y:16}],
 [{e:'📷',w:92,h:78,x:6,y:12},{e:'📘',w:76,h:104,x:39,y:45},{e:'☕',w:72,h:72,x:70,y:14}],
 [{e:'👟',w:128,h:68,x:5,y:12},{e:'👕',w:102,h:80,x:55,y:55},{e:'🎧',w:86,h:86,x:10,y:60}],
 [{e:'📗',w:70,h:110,x:5,y:18},{e:'📷',w:94,h:76,x:38,y:55},{e:'☕',w:70,h:70,x:70,y:16}]
];
let level=0,placed=0;const box=document.querySelector('#box'),tray=document.querySelector('#tray'),win=document.querySelector('#win'),lv=document.querySelector('#lv');
function load(){tray.innerHTML='';box.querySelectorAll('.slot').forEach(s=>s.remove());win.classList.remove('show');placed=0;lv.textContent=level+1;const items=levels[level];items.forEach((o,i)=>{const s=document.createElement('div');s.className='slot';s.dataset.i=i;s.style.width=o.w+'px';s.style.height=o.h+'px';s.style.left=o.x+'%';s.style.top=o.y+'%';box.appendChild(s);const el=document.createElement('div');el.className='item';el.textContent=o.e;el.dataset.i=i;el.style.width=o.w+'px';el.style.height=o.h+'px';el.style.left=(7+i*(84/items.length))+'%';el.style.top=(18+(i%2)*30)+'%';tray.appendChild(el);drag(el,s)});}
function drag(el,slot){let dx=0,dy=0,active=false,start={};el.addEventListener('pointerdown',e=>{if(el.classList.contains('placed'))return;active=true;el.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();start={left:el.style.left,top:el.style.top,pos:el.style.position};dx=e.clientX-r.left;dy=e.clientY-r.top;el.classList.add('drag');el.style.position='fixed';el.style.zIndex=10;move(e)});el.addEventListener('pointermove',e=>{if(!active)return;move(e);const r=el.getBoundingClientRect(),s=slot.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2,sx=s.left+s.width/2,sy=s.top+s.height/2;slot.classList.toggle('hot',Math.hypot(cx-sx,cy-sy)<80)});el.addEventListener('pointerup',()=>{if(!active)return;active=false;el.classList.remove('drag');slot.classList.remove('hot');const r=el.getBoundingClientRect(),s=slot.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2,sx=s.left+s.width/2,sy=s.top+s.height/2;if(Math.hypot(cx-sx,cy-sy)<80){const b=box.getBoundingClientRect();el.classList.add('placed');el.style.position='fixed';el.style.left=s.left+'px';el.style.top=s.top+'px';el.style.zIndex=3;slot.style.opacity='.15';placed++;if(navigator.vibrate)navigator.vibrate([20,20,35]);setTimeout(()=>{if(placed===levels[level].length)win.classList.add('show')},250)}else{el.style.position=start.pos||'absolute';el.style.left=start.left;el.style.top=start.top;el.style.zIndex='';if(navigator.vibrate)navigator.vibrate(8)}});function move(e){el.style.left=(e.clientX-dx)+'px';el.style.top=(e.clientY-dy)+'px'}}
document.querySelector('#next').onclick=()=>{level=(level+1)%levels.length;load()};load();
</script></body></html>
