const BUILD='0039';let cacheChecking=false;async function checkLatest(){if(cacheChecking)return;cacheChecking=true;try{const r=await fetch(`./?cachecheck=${Date.now()}`,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});const t=await r.text(),m=t.match(/const BUILD='(\d+)'/);if(m&&m[1]!==BUILD){const u=new URL(location.href);u.searchParams.set('v',m[1]);u.searchParams.set('_',Date.now().toString());location.replace(u.href);return}}catch(e){}finally{cacheChecking=false}}setTimeout(checkLatest,500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkLatest()});window.addEventListener('focus',checkLatest);
document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});document.addEventListener('dragstart',e=>e.preventDefault(),{passive:false});

const levels=[['book','folded'],['book','shoe'],['book','folded','mug'],['shoe','book','camera'],['book','folded','camera','mug']];
let level=0,selected=null,idSeq=0;const box=document.querySelector('#box'),boxwrap=document.querySelector('#boxwrap'),conveyor=document.querySelector('#conveyor'),smoke=document.querySelector('#smoke'),tray=document.querySelector('#tray'),rot=document.querySelector('#rotate'),win=document.querySelector('#win'),next=document.querySelector('#next'),lv=document.querySelector('#lv');
const splash=document.querySelector('#splash'),startGame=document.querySelector('#startGame');startGame.addEventListener('click',()=>{splash.classList.add('hide');if(navigator.vibrate)navigator.vibrate(18)});
const rotateShape=s=>{const h=s.length,w=s[0].length,r=Array.from({length:w},()=>Array(h).fill(0));for(let y=0;y<h;y++)for(let x=0;x<w;x++)r[x][h-1-y]=s[y][x];return r};
function occupied(except){const out=new Set();[...box.querySelectorAll('.item')].forEach(e=>{if(e===except)return;const st=e._st;if(st.row==null)return;cells(st.shape,st.row,st.col).forEach(([r,c])=>out.add(r+','+c))});return out}
function cells(shape,row,col){let a=[];shape.forEach((rr,y)=>rr.forEach((v,x)=>{if(v)a.push([row+y,col+x])}));return a}
function canPlace(e,row,col,shape=e._st.shape){const occ=occupied(e);return cells(shape,row,col).every(([r,c])=>r>=0&&r<ROWS&&c>=0&&c<COLS&&!occ.has(r+','+c))}
function syncArt(e){const art=e.querySelector('.item-art');if(!art)return;const w=parseFloat(e.style.width)||e.offsetWidth,h=parseFloat(e.style.height)||e.offsetHeight,odd=e._st.rot===1;art.style.width=(odd?h:w)+'px';art.style.height=(odd?w:h)+'px';art.style.transform=`translate(-50%,-50%) rotate(${e._st.rot*90}deg)`}
function sizeItem(e){const s=e._st.shape,b=box.getBoundingClientRect(),cw=b.width/COLS,ch=b.height/ROWS;e.style.width=(s[0].length*cw)+'px';e.style.height=(s.length*ch)+'px';syncArt(e)}
function positionItem(e){const st=e._st,b=box.getBoundingClientRect(),cw=b.width/COLS,ch=b.height/ROWS;sizeItem(e);e.style.left=(st.col*cw)+'px';e.style.top=(st.row*ch)+'px'}
function trayPosition(e){const i=Number(e.dataset.slot)||0;e.style.left=(5+i*(88/levels[level].length))+'%';e.style.top=(8+(i%2)*44)+'%'}

function load(){tray.innerHTML='';box.innerHTML='';boxwrap.classList.remove('closed','shaking');smoke.classList.remove('poof');win.classList.remove('show');next.classList.remove('show');rot.classList.remove('show');selected=null;lv.textContent=level+1;levels[level].forEach((name,i)=>{let o=catalog[name],e=document.createElement('div');e.className='item '+o.c;e.dataset.slot=i;const baseShape=o.shape.map(r=>r.slice());e._st={id:++idSeq,name,baseShape,shape:baseShape.map(r=>r.slice()),row:null,col:null,rot:0};if(o.asset){const img=document.createElement('img');img.className='item-art';img.src=o.asset;img.alt='';img.draggable=false;e.appendChild(img)}tray.appendChild(e);trayPosition(e);setTimeout(()=>sizeItem(e),0);drag(e)})}
function drag(e){let armed=false,moving=false,startX=0,startY=0,holdX=0,holdY=0,origin=null;e.addEventListener('pointerdown',p=>{p.preventDefault();if(win.classList.contains('show')&&e.parentNode===box)return;selected=e;rot.classList.add('show');armed=true;moving=false;startX=p.clientX;startY=p.clientY;e.setPointerCapture(p.pointerId);origin={parent:e.parentNode,row:e._st.row,col:e._st.col,left:e.style.left,top:e.style.top};});e.addEventListener('pointermove',p=>{if(!armed)return;p.preventDefault();if(origin&&origin.parent===box)return;if(!moving){if(Math.hypot(p.clientX-startX,p.clientY-startY)<7)return;const r=e.getBoundingClientRect();holdX=r.width+24;holdY=r.height+24;moving=true;e.classList.add('drag');e.style.position='fixed';e.style.zIndex=30;}e.style.left=(p.clientX-holdX)+'px';e.style.top=(p.clientY-holdY)+'px'});e.addEventListener('pointerup',p=>{p.preventDefault();if(!armed)return;armed=false;if(origin&&origin.parent===box&&!moving){if(win.classList.contains('show'))return;sendToTray(e);selected=e;rot.classList.add('show');if(navigator.vibrate)navigator.vibrate(18);return}if(!moving)return;moving=false;e.classList.remove('drag');const r=e.getBoundingClientRect(),b=box.getBoundingClientRect(),t=tray.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const overTray=cx>=t.left&&cx<=t.right&&cy>=t.top&&cy<=t.bottom;if(overTray){sendToTray(e);if(navigator.vibrate)navigator.vibrate(18);return}const cw=b.width/COLS,ch=b.height/ROWS,col=Math.round((r.left-b.left)/cw),row=Math.round((r.top-b.top)/ch);if(canPlace(e,row,col)){box.appendChild(e);e._st.row=row;e._st.col=col;e.style.position='absolute';e.style.zIndex=5;positionItem(e);if(navigator.vibrate)navigator.vibrate(25);check()}else{restore(e,origin)}});e.addEventListener('pointercancel',p=>{p.preventDefault();if(!armed)return;armed=false;if(moving){moving=false;e.classList.remove('drag');restore(e,origin)}})}
function restore(e,o){e._st.row=o.row;e._st.col=o.col;o.parent.appendChild(e);e.style.position='absolute';e.style.zIndex='';if(o.parent===box){positionItem(e)}else{e.style.left=o.left;e.style.top=o.top;sizeItem(e)}e.classList.remove('invalid');void e.offsetWidth;e.classList.add('invalid');if(navigator.vibrate)navigator.vibrate(8)}
rot.addEventListener('click',()=>{if(!selected)return;const targetRot=selected._st.rot===0?1:0;const ns=targetRot===1?rotateShape(selected._st.baseShape):selected._st.baseShape.map(r=>r.slice());if(selected.parentNode===box){const {row,col}=selected._st;if(!canPlace(selected,row,col,ns)){selected.classList.remove('invalid');void selected.offsetWidth;selected.classList.add('invalid');if(navigator.vibrate)navigator.vibrate(12);return}}selected._st.shape=ns;selected._st.rot=targetRot;if(selected.parentNode===box)positionItem(selected);else sizeItem(selected);if(navigator.vibrate)navigator.vibrate(18);check()});
function check(){const all=[...document.querySelectorAll('.item')];if(all.length&&all.every(e=>e.parentNode===box)){win.classList.add('show');rot.classList.remove('show');selected=null;if(navigator.vibrate)navigator.vibrate([25,30,55]);setTimeout(()=>{boxwrap.classList.add('shaking');if(navigator.vibrate)navigator.vibrate([15,35,15,30,20])},260);setTimeout(()=>{smoke.classList.remove('poof');void smoke.offsetWidth;smoke.classList.add('poof');boxwrap.classList.add('closed');if(navigator.vibrate)navigator.vibrate(28)},720);setTimeout(()=>boxwrap.classList.remove('shaking'),800);setTimeout(()=>next.classList.add('show'),1350)}}
let nextBusy=false;next.addEventListener('pointerdown',e=>{e.preventDefault();if(nextBusy||!next.classList.contains('show'))return;nextBusy=true;next.classList.remove('show');win.classList.remove('show');boxwrap.classList.remove('shaking');conveyor.classList.add('moving');boxwrap.classList.add('slideout');if(navigator.vibrate)navigator.vibrate(16);setTimeout(()=>{level=(level+1)%levels.length;boxwrap.classList.remove('slideout');boxwrap.classList.add('preenter');load();boxwrap.classList.add('preenter');void boxwrap.offsetWidth;boxwrap.classList.remove('preenter');boxwrap.classList.add('slidein')},350);setTimeout(()=>{boxwrap.classList.remove('slidein');conveyor.classList.remove('moving');nextBusy=false},800)});window.addEventListener('resize',()=>[...document.querySelectorAll('.item')].forEach(e=>e.parentNode===box?positionItem(e):sizeItem(e)));load();
