<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>PACK IT!</title><style>*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}body{margin:0;font-family:system-ui;background:#f8efdf;color:#3c2b20}.game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#fbf4e6 0 64%,#deb88e 64%)}img{pointer-events:none;-webkit-user-drag:none;user-drag:none}header{padding:55px 25px;display:flex;justify-content:space-between;font-weight:900;font-size:25px}.boxwrap{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:min(96vw,500px);aspect-ratio:1}.boxart{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 18px #54341d25);pointer-events:none}.box{position:absolute;left:23.5%;top:30%;width:53%;height:39%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);background-image:linear-gradient(to right,#fff2 1px,transparent 1px),linear-gradient(to bottom,#fff2 1px,transparent 1px);background-size:12.5% 100%,100% 16.666%;overflow:visible}.tray{position:absolute;inset:auto 0 4% 0;height:27%}.item{position:absolute;display:grid;place-items:center;border-radius:12px;transition:transform .12s}.item.drag{transform:scale(1.06);transition:none}.item.invalid{animation:shake .2s}.item-art{position:absolute;left:50%;top:50%;object-fit:contain;pointer-events:none;transition:transform .14s ease;transform-origin:center}.book,.folded,.shoe,.mug{background:transparent;border:0;box-shadow:none;border-radius:0}.book:after,.folded:after,.shoe:after,.mug:after{content:none}.camera{box-shadow:0 7px 5px #432b1c44;background:linear-gradient(#474d51,#24292c);border:3px solid #181c1e}.camera:after{content:'';width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#a9d4e4 0 18%,#34515d 20% 48%,#111 50%);border:4px solid #62696d}.rotate{position:absolute;bottom:31%;left:50%;transform:translateX(-50%);border:0;border-radius:22px;padding:12px 20px;background:white;font-weight:900;display:none;box-shadow:0 8px 20px #54341d22}.rotate.show{display:block}.hint{position:absolute;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 10px);width:100%;text-align:center;font-weight:800;opacity:.5}.win{position:absolute;top:14%;width:100%;text-align:center;font-size:25px;font-weight:1000;opacity:0}.win.show{opacity:1}.next{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);padding:14px 24px;border:0;border-radius:22px;background:#3c2b20;color:white;font-weight:900;display:none}.next.show{display:block}.version{position:absolute;left:50%;transform:translateX(-50%);bottom:max(6px,env(safe-area-inset-bottom));font-size:10px;opacity:.35;white-space:nowrap}.splash{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 34%,#fff9ed 0,#f8eddc 42%,#e7bf91 100%);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));transition:opacity .38s ease,visibility .38s ease}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-card{text-align:center;max-width:430px;width:100%;transform:translateY(-2vh)}.splash-box{font-size:86px;line-height:1;filter:drop-shadow(0 14px 12px #6e452c30);animation:floatbox 2.3s ease-in-out infinite}.splash-title{font-size:clamp(48px,15vw,72px);line-height:.92;margin:24px 0 12px;font-weight:1000;letter-spacing:-4px}.splash-tag{font-size:16px;font-weight:900;letter-spacing:3px;opacity:.58;margin-bottom:42px}.splash-start{border:0;border-radius:999px;padding:17px 38px;background:#3c2b20;color:#fff;font-size:17px;font-weight:1000;box-shadow:0 12px 26px #54341d33;min-width:190px}.splash-version{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 4px);transform:translateX(-50%);font-size:12px;font-weight:800;letter-spacing:1px;opacity:.42;white-space:nowrap}@keyframes floatbox{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body><div id="splash" class="splash"><div class="splash-card"><div class="splash-box">📦</div><div class="splash-title">PACK IT!</div><div class="splash-tag">ORDENA · ENCAJA · ENVÍA</div><button id="startGame" class="splash-start">EMPEZAR</button></div><div class="splash-version">DEV 0.0.28</div></div><main class="game"><header><span>PACK IT! 📦</span><span>Caja <b id="lv">1</b>/5</span></header><div class="boxwrap"><img class="boxart" src="assets/boxes/box-open.webp?v=0028" alt=""><div id="box" class="box"></div></div><div id="tray" class="tray"></div><button id="rotate" class="rotate">↻ Girar objeto</button><div class="hint">Arrastra desde abajo · toca una pieza colocada para retirarla</div><div id="win" class="win">✨ PERFECT PACK!</div><button id="next" class="next">Siguiente caja →</button><div class="version">DEV 0.0.28</div></main><script>
const BUILD='0028';let cacheChecking=false;async function checkLatest(){if(cacheChecking)return;cacheChecking=true;try{const r=await fetch(`./?cachecheck=${Date.now()}`,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});const t=await r.text(),m=t.match(/const BUILD='(\d+)'/);if(m&&m[1]!==BUILD){const u=new URL(location.href);u.searchParams.set('v',m[1]);u.searchParams.set('_',Date.now().toString());location.replace(u.href);return}}catch(e){}finally{cacheChecking=false}}setTimeout(checkLatest,500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkLatest()});window.addEventListener('focus',checkLatest);
document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});document.addEventListener('dragstart',e=>e.preventDefault(),{passive:false});
const ROWS=6,COLS=8;
const catalog={book:{c:'book',asset:'assets/items/book-red-bible-v2.webp?v=0028',shape:[[1,1],[1,1],[1,1]]},folded:{c:'folded',asset:'assets/items/tshirt-folded-blue-v2.webp?v=0028',shape:[[1,1,1],[1,1,1]]},shoe:{c:'shoe',asset:'assets/items/sneaker-sport-red-white-v1.webp?v=0028',shape:[[1,1,1,0],[1,1,1,1]]},mug:{c:'mug',asset:'assets/items/mug-white-red-v1.webp?v=0028',shape:[[1,1],[1,1],[1,0]]},camera:{c:'camera',shape:[[1,1,1],[1,1,1]]}};
const levels=[['book','folded'],['book','shoe'],['book','folded','mug'],['shoe','book','camera'],['book','folded','camera','mug']];
let level=0,selected=null,idSeq=0;const box=document.querySelector('#box'),tray=document.querySelector('#tray'),rot=document.querySelector('#rotate'),win=document.querySelector('#win'),next=document.querySelector('#next'),lv=document.querySelector('#lv');
const splash=document.querySelector('#splash'),startGame=document.querySelector('#startGame');startGame.addEventListener('click',()=>{splash.classList.add('hide');if(navigator.vibrate)navigator.vibrate(18)});
const rotateShape=s=>{const h=s.length,w=s[0].length,r=Array.from({length:w},()=>Array(h).fill(0));for(let y=0;y<h;y++)for(let x=0;x<w;x++)r[x][h-1-y]=s[y][x];return r};
function occupied(except){const out=new Set();[...box.querySelectorAll('.item')].forEach(e=>{if(e===except)return;const st=e._st;if(st.row==null)return;cells(st.shape,st.row,st.col).forEach(([r,c])=>out.add(r+','+c))});return out}
function cells(shape,row,col){let a=[];shape.forEach((rr,y)=>rr.forEach((v,x)=>{if(v)a.push([row+y,col+x])}));return a}
function canPlace(e,row,col,shape=e._st.shape){const occ=occupied(e);return cells(shape,row,col).every(([r,c])=>r>=0&&r<ROWS&&c>=0&&c<COLS&&!occ.has(r+','+c))}
function syncArt(e){const art=e.querySelector('.item-art');if(!art)return;const w=parseFloat(e.style.width)||e.offsetWidth,h=parseFloat(e.style.height)||e.offsetHeight,odd=e._st.rot===1;art.style.width=(odd?h:w)+'px';art.style.height=(odd?w:h)+'px';art.style.transform=`translate(-50%,-50%) rotate(${e._st.rot*90}deg)`}
function sizeItem(e){const s=e._st.shape,b=box.getBoundingClientRect(),cw=b.width/COLS,ch=b.height/ROWS;e.style.width=(s[0].length*cw)+'px';e.style.height=(s.length*ch)+'px';syncArt(e)}
function positionItem(e){const st=e._st,b=box.getBoundingClientRect(),cw=b.width/COLS,ch=b.height/ROWS;sizeItem(e);e.style.left=(st.col*cw)+'px';e.style.top=(st.row*ch)+'px'}
function trayPosition(e){const i=Number(e.dataset.slot)||0;e.style.left=(5+i*(88/levels[level].length))+'%';e.style.top=(8+(i%2)*44)+'%'}
function sendToTray(e){e._st.row=null;e._st.col=null;tray.appendChild(e);e.style.position='absolute';e.style.zIndex='';trayPosition(e);sizeItem(e);win.classList.remove('show');next.classList.remove('show')}
function load(){tray.innerHTML='';box.innerHTML='';win.classList.remove('show');next.classList.remove('show');rot.classList.remove('show');selected=null;lv.textContent=level+1;levels[level].forEach((name,i)=>{let o=catalog[name],e=document.createElement('div');e.className='item '+o.c;e.dataset.slot=i;const baseShape=o.shape.map(r=>r.slice());e._st={id:++idSeq,name,baseShape,shape:baseShape.map(r=>r.slice()),row:null,col:null,rot:0};if(o.asset){const img=document.createElement('img');img.className='item-art';img.src=o.asset;img.alt='';img.draggable=false;e.appendChild(img)}tray.appendChild(e);trayPosition(e);setTimeout(()=>sizeItem(e),0);drag(e)})}
function drag(e){let armed=false,moving=false,startX=0,startY=0,holdX=0,holdY=0,origin=null;e.addEventListener('pointerdown',p=>{p.preventDefault();if(win.classList.contains('show')&&e.parentNode===box)return;selected=e;rot.classList.add('show');armed=true;moving=false;startX=p.clientX;startY=p.clientY;e.setPointerCapture(p.pointerId);origin={parent:e.parentNode,row:e._st.row,col:e._st.col,left:e.style.left,top:e.style.top};});e.addEventListener('pointermove',p=>{if(!armed)return;p.preventDefault();if(origin&&origin.parent===box)return;if(!moving){if(Math.hypot(p.clientX-startX,p.clientY-startY)<7)return;const r=e.getBoundingClientRect();holdX=r.width+24;holdY=r.height+24;moving=true;e.classList.add('drag');e.style.position='fixed';e.style.zIndex=30;}e.style.left=(p.clientX-holdX)+'px';e.style.top=(p.clientY-holdY)+'px'});e.addEventListener('pointerup',p=>{p.preventDefault();if(!armed)return;armed=false;if(origin&&origin.parent===box&&!moving){if(win.classList.contains('show'))return;sendToTray(e);selected=e;rot.classList.add('show');if(navigator.vibrate)navigator.vibrate(18);return}if(!moving)return;moving=false;e.classList.remove('drag');const r=e.getBoundingClientRect(),b=box.getBoundingClientRect(),t=tray.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;const overTray=cx>=t.left&&cx<=t.right&&cy>=t.top&&cy<=t.bottom;if(overTray){sendToTray(e);if(navigator.vibrate)navigator.vibrate(18);return}const cw=b.width/COLS,ch=b.height/ROWS,col=Math.round((r.left-b.left)/cw),row=Math.round((r.top-b.top)/ch);if(canPlace(e,row,col)){box.appendChild(e);e._st.row=row;e._st.col=col;e.style.position='absolute';e.style.zIndex=5;positionItem(e);if(navigator.vibrate)navigator.vibrate(25);check()}else{restore(e,origin)}});e.addEventListener('pointercancel',p=>{p.preventDefault();if(!armed)return;armed=false;if(moving){moving=false;e.classList.remove('drag');restore(e,origin)}})}
function restore(e,o){e._st.row=o.row;e._st.col=o.col;o.parent.appendChild(e);e.style.position='absolute';e.style.zIndex='';if(o.parent===box){positionItem(e)}else{e.style.left=o.left;e.style.top=o.top;sizeItem(e)}e.classList.remove('invalid');void e.offsetWidth;e.classList.add('invalid');if(navigator.vibrate)navigator.vibrate(8)}
rot.addEventListener('click',()=>{if(!selected)return;const targetRot=selected._st.rot===0?1:0;const ns=targetRot===1?rotateShape(selected._st.baseShape):selected._st.baseShape.map(r=>r.slice());if(selected.parentNode===box){const {row,col}=selected._st;if(!canPlace(selected,row,col,ns)){selected.classList.remove('invalid');void selected.offsetWidth;selected.classList.add('invalid');if(navigator.vibrate)navigator.vibrate(12);return}}selected._st.shape=ns;selected._st.rot=targetRot;if(selected.parentNode===box)positionItem(selected);else sizeItem(selected);if(navigator.vibrate)navigator.vibrate(18);check()});
function check(){const all=[...document.querySelectorAll('.item')];if(all.length&&all.every(e=>e.parentNode===box)){win.classList.add('show');next.classList.add('show');rot.classList.remove('show');selected=null;if(navigator.vibrate)navigator.vibrate([25,30,55])}}
next.addEventListener('click',()=>{level=(level+1)%levels.length;load()});window.addEventListener('resize',()=>[...document.querySelectorAll('.item')].forEach(e=>e.parentNode===box?positionItem(e):sizeItem(e)));load();
</script></body></html>
