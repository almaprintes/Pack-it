<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6eddc">
<title>PACK IT!</title>
<style>
*{box-sizing:border-box;touch-action:none}html,body{margin:0;height:100%;overflow:hidden;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded",sans-serif;background:#efe3cc;color:#403126}body{display:grid;place-items:center}.game{position:relative;width:min(100vw,520px);height:100dvh;overflow:hidden;background:linear-gradient(#fbf4e5 0 62%,#ddb78d 62%)}header{position:absolute;z-index:30;top:max(18px,env(safe-area-inset-top));left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:1000;font-size:27px;letter-spacing:-1px}.level{background:#fff9;padding:8px 13px;border-radius:20px;font-weight:900;box-shadow:0 5px 14px #6e482610}.stage{position:absolute;left:10%;top:22%;width:80%;height:36%;perspective:800px}.box{position:absolute;inset:0;background:linear-gradient(145deg,#c98b58,#b97747);border:10px solid #955b34;border-radius:15px;box-shadow:inset 0 0 0 4px #e1aa78,inset 0 18px 30px #7d49251e,0 20px 35px #6e482635;transition:transform .35s cubic-bezier(.2,.9,.25,1.3),filter .3s}.box.bump{animation:boxbump .32s cubic-bezier(.2,1.5,.4,1)}.flap{position:absolute;z-index:8;top:-27px;height:25px;width:48%;background:linear-gradient(#dfa46f,#c98a57);border:5px solid #9b6039;transform-origin:bottom;transition:transform .48s cubic-bezier(.2,.85,.25,1.15),top .48s}.flap.left{left:-4px;transform:skewX(10deg)}.flap.right{right:-4px;transform:skewX(-10deg)}.stage.closing .flap.left{top:3px;transform:skewX(0deg) rotateX(78deg)}.stage.closing .flap.right{top:3px;transform:skewX(0deg) rotateX(78deg)}.lid{position:absolute;z-index:12;inset:7px;background:#ce8d59;border:5px solid #9b6039;border-radius:7px;opacity:0;transform:scaleY(.15);transition:.34s .28s cubic-bezier(.2,.9,.25,1.2)}.stage.closing .lid{opacity:1;transform:scaleY(1)}.tape{position:absolute;z-index:14;left:45%;top:5%;width:10%;height:90%;background:linear-gradient(90deg,#e9c583,#f5d99f,#ddb36e);opacity:0;transform:scaleY(0);transform-origin:top;box-shadow:0 0 0 1px #a5794235;transition:transform .38s .56s ease-out,opacity .1s .56s}.stage.closing .tape{opacity:.94;transform:scaleY(1)}.stage.ship{animation:ship .7s ease-in forwards}.slot{position:absolute;border:2px dashed #f9dec068;border-radius:17px;background:#fff1;transition:.14s}.slot.hot{border-color:#fff;background:#fff3;box-shadow:0 0 0 5px #fff2,0 0 28px #ffe4aa88;transform:scale(1.06)}.slot.done{opacity:0}.tray{position:absolute;left:0;right:0;bottom:4%;height:31%}.item{position:absolute;display:grid;place-items:center;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 8px 5px #4d321d35);font-size:58px;border-radius:18px;cursor:grab;transition:left .2s cubic-bezier(.2,1.2,.4,1),top .2s cubic-bezier(.2,1.2,.4,1),transform .12s,filter .12s}.item:before{content:"";position:absolute;z-index:-1;width:86%;height:52%;bottom:5%;border-radius:50%;background:#4b2f1a13;filter:blur(7px)}.item.drag{filter:drop-shadow(0 17px 9px #4d321d4d);transform:scale(1.13) rotate(-2deg);transition:transform .1s,filter .1s}.item.placed{animation:snap .42s cubic-bezier(.15,1.7,.4,1);filter:drop-shadow(0 3px 2px #4d321d22)}.hint{position:absolute;bottom:1.5%;left:0;right:0;text-align:center;font-size:13px;font-weight:850;opacity:.48}.toast{position:absolute;z-index:40;left:50%;top:16%;transform:translate(-50%,-25px) scale(.82);padding:12px 19px;background:#fff;border-radius:24px;font-weight:1000;font-size:20px;box-shadow:0 10px 30px #59381f30;opacity:0;transition:.3s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}.next{position:absolute;z-index:50;left:50%;bottom:9%;transform:translate(-50%,30px);border:0;background:#403126;color:#fff;padding:14px 25px;border-radius:21px;font-size:17px;font-weight:1000;opacity:0;pointer-events:none;box-shadow:0 10px 25px #4c311f35;transition:.28s}.next.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}.spark{position:fixed;z-index:45;width:8px;height:8px;border-radius:50%;background:#fff5c7;pointer-events:none;animation:spark .46s ease-out forwards}.version{position:absolute;right:8px;bottom:5px;font-size:10px;opacity:.32}@keyframes snap{0%{transform:scale(1.15)}38%{transform:scale(.86)}70%{transform:scale(1.07)}100%{transform:scale(1)}}@keyframes boxbump{0%,100%{transform:scale(1)}45%{transform:scale(.985)}70%{transform:scale(1.012)}}@keyframes spark{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(.2)}}@keyframes ship{0%{transform:translateX(0) rotate(0);opacity:1}25%{transform:translateX(-7px) rotate(-1deg)}100%{transform:translateX(125vw) rotate(4deg);opacity:0}}
</style></head>
<body><main class="game"><header><div class="logo">PACK IT! 📦</div><div class="level">Caja <span id="lv">1</span>/5</div></header><div id="stage" class="stage"><div id="box" class="box"><div class="flap left"></div><div class="flap right"></div><div class="lid"></div><div class="tape"></div></div></div><div id="tray" class="tray"></div><div class="hint">Encuentra dónde encaja cada objeto</div><div id="toast" class="toast">✨ PERFECT PACK!</div><button id="next" class="next">Siguiente caja →</button><div class="version">DEV 0.0.3</div></main>
<script>
const levels=[
 [{e:'📕',w:82,h:104,x:8,y:18},{e:'👕',w:105,h:82,x:56,y:48}],
 [{e:'🎧',w:92,h:92,x:8,y:48},{e:'👟',w:130,h:70,x:48,y:16}],
 [{e:'📷',w:92,h:78,x:6,y:12},{e:'📘',w:76,h:104,x:39,y:45},{e:'☕',w:72,h:72,x:70,y:14}],
 [{e:'👟',w:128,h:68,x:5,y:12},{e:'👕',w:102,h:80,x:55,y:55},{e:'🎧',w:86,h:86,x:10,y:60}],
 [{e:'📗',w:70,h:110,x:5,y:18},{e:'📷',w:94,h:76,x:38,y:55},{e:'☕',w:70,h:70,x:70,y:16}]
];
let level=0,placed=0,audioCtx;const box=document.querySelector('#box'),stage=document.querySelector('#stage'),tray=document.querySelector('#tray'),toast=document.querySelector('#toast'),next=document.querySelector('#next'),lv=document.querySelector('#lv');
function tone(freq=520,d=.06,type='sine',vol=.055){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.22,audioCtx.currentTime+d);g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch{}}
function sparks(x,y){for(let i=0;i<10;i++){const p=document.createElement('i');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';const a=(Math.PI*2/10)*i,r=25+Math.random()*22;p.style.setProperty('--x',Math.cos(a)*r+'px');p.style.setProperty('--y',Math.sin(a)*r+'px');document.body.appendChild(p);setTimeout(()=>p.remove(),500)}}
function load(){tray.innerHTML='';box.querySelectorAll('.slot').forEach(s=>s.remove());stage.className='stage';toast.classList.remove('show');next.classList.remove('show');placed=0;lv.textContent=level+1;const items=levels[level];items.forEach((o,i)=>{const s=document.createElement('div');s.className='slot';s.style.width=o.w+'px';s.style.height=o.h+'px';s.style.left=o.x+'%';s.style.top=o.y+'%';box.appendChild(s);const el=document.createElement('div');el.className='item';el.textContent=o.e;el.style.width=o.w+'px';el.style.height=o.h+'px';el.style.left=(7+i*(84/items.length))+'%';el.style.top=(18+(i%2)*30)+'%';tray.appendChild(el);drag(el,s)});}
function drag(el,slot){let dx=0,dy=0,active=false,start={};el.addEventListener('pointerdown',e=>{if(el.classList.contains('placed'))return;active=true;tone(240,.035,'sine',.025);el.setPointerCapture(e.pointerId);const r=el.getBoundingClientRect();start={left:el.style.left,top:el.style.top,pos:el.style.position};dx=e.clientX-r.left;dy=e.clientY-r.top;el.classList.add('drag');el.style.position='fixed';el.style.zIndex=20;move(e)});el.addEventListener('pointermove',e=>{if(!active)return;move(e);const r=el.getBoundingClientRect(),s=slot.getBoundingClientRect();const d=Math.hypot(r.left+r.width/2-(s.left+s.width/2),r.top+r.height/2-(s.top+s.height/2));slot.classList.toggle('hot',d<92)});el.addEventListener('pointerup',()=>{if(!active)return;active=false;el.classList.remove('drag');slot.classList.remove('hot');const r=el.getBoundingClientRect(),s=slot.getBoundingClientRect();const d=Math.hypot(r.left+r.width/2-(s.left+s.width/2),r.top+r.height/2-(s.top+s.height/2));if(d<92){el.classList.add('placed');el.style.position='fixed';el.style.left=s.left+'px';el.style.top=s.top+'px';el.style.zIndex=6;slot.classList.add('done');placed++;tone(430,.08,'triangle',.07);setTimeout(()=>tone(680,.07,'sine',.045),45);if(navigator.vibrate)navigator.vibrate([18,22,42]);sparks(s.left+s.width/2,s.top+s.height/2);box.classList.remove('bump');void box.offsetWidth;box.classList.add('bump');if(placed===levels[level].length)setTimeout(complete,520)}else{el.style.position=start.pos||'absolute';el.style.left=start.left;el.style.top=start.top;el.style.zIndex='';tone(150,.05,'sine',.018);if(navigator.vibrate)navigator.vibrate(8)}});function move(e){el.style.left=(e.clientX-dx)+'px';el.style.top=(e.clientY-dy)+'px'}}
function complete(){toast.classList.add('show');tone(520,.11,'triangle',.055);setTimeout(()=>tone(780,.15,'triangle',.05),90);if(navigator.vibrate)navigator.vibrate([25,35,55]);setTimeout(()=>stage.classList.add('closing'),250);setTimeout(()=>next.classList.add('show'),1150)}
next.onclick=()=>{next.classList.remove('show');toast.classList.remove('show');stage.classList.add('ship');tone(260,.12,'sine',.025);setTimeout(()=>{level=(level+1)%levels.length;load()},620)};load();
</script></body></html>
