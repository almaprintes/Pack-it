<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PACK IT!</title><style>*{box-sizing:border-box;touch-action:none}body{margin:0;font-family:system-ui;background:#f8efdf;color:#3c2b20}.game{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#fbf4e6 0 64%,#deb88e 64%)}header{padding:55px 25px;display:flex;justify-content:space-between;font-weight:900;font-size:25px}.boxwrap{position:absolute;left:50%;top:19%;transform:translateX(-50%);width:min(96vw,500px);aspect-ratio:1}.boxart{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 18px #54341d25);pointer-events:none}.box{position:absolute;left:23.5%;top:30%;width:53%;height:39%;overflow:visible}.tray{position:absolute;inset:auto 0 4% 0;height:27%}.item{position:absolute;display:grid;place-items:center;border-radius:14px;filter:drop-shadow(0 8px 5px #432b1c44);transition:transform .15s}.item.drag{transform:scale(1.08)}.book{background:linear-gradient(90deg,#92251f 8%,#d84b40 9% 88%,#f2d5ae 89% 94%,#7c201d 95%);border:3px solid #72211e}.book:after{content:'VOL.1';font:900 11px Georgia}.folded{background:linear-gradient(145deg,#8ac9ef,#438fc5);border:3px solid #347baa;box-shadow:inset 0 9px #ffffff25,inset -7px -6px #266d9b22}.folded:before{content:'';position:absolute;top:13%;left:12%;right:12%;height:2px;background:#d7effc99}.folded:after{content:'•••';color:#d8effb;letter-spacing:5px;font-weight:900}.shoe{background:linear-gradient(#faf9f3 55%,#d7d6cf 56% 75%,#4e78a6 76%);border-radius:55% 25% 18% 25%;border:2px solid #aaa}.mug{background:linear-gradient(90deg,#e9c787,#ffe6ae);border:3px solid #caa66c}.mug:after{content:'';position:absolute;right:-16px;width:23px;height:32px;border:7px solid #d6b474;border-left:0;border-radius:0 16px 16px 0}.camera{background:linear-gradient(#474d51,#24292c);border:3px solid #181c1e}.camera:after{content:'';width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#a9d4e4 0 18%,#34515d 20% 48%,#111 50%);border:4px solid #62696d}.rotate{position:absolute;bottom:31%;left:50%;transform:translateX(-50%);border:0;border-radius:22px;padding:12px 20px;background:white;font-weight:900;display:none;box-shadow:0 8px 20px #54341d22}.rotate.show{display:block}.hint{position:absolute;bottom:2%;width:100%;text-align:center;font-weight:800;opacity:.5}.win{position:absolute;top:14%;width:100%;text-align:center;font-size:25px;font-weight:1000;opacity:0}.win.show{opacity:1}.next{position:absolute;bottom:9%;left:50%;transform:translateX(-50%);padding:14px 24px;border:0;border-radius:22px;background:#3c2b20;color:white;font-weight:900;display:none}.next.show{display:block}.version{position:absolute;right:8px;bottom:5px;font-size:10px;opacity:.35}</style></head><body><main class="game"><header><span>PACK IT! 📦</span><span>Caja <b id="lv">1</b>/5</span></header><div class="boxwrap"><img class="boxart" src="assets/boxes/box-open.webp" alt=""><div id="box" class="box"></div></div><div id="tray" class="tray"></div><button id="rotate" class="rotate">↻ Girar objeto</button><div class="hint">Haz que todo quepa · sin solapar</div><div id="win" class="win">✨ PERFECT PACK!</div><button id="next" class="next">Siguiente caja →</button><div class="version">DEV 0.0.6</div></main><script>const catalog={book:{c:'book',w:72,h:108},folded:{c:'folded',w:102,h:76},shoe:{c:'shoe',w:130,h:59},mug:{c:'mug',w:59,h:64},camera:{c:'camera',w:84,h:64}};const levels=[['book','folded'],['book','shoe'],['book','folded','mug'],['shoe','book','camera'],['book','folded','camera','mug']];let level=0,sel=null;const box=document.querySelector('#box'),tray=document.querySelector('#tray'),rot=document.querySelector('#rotate'),win=document.querySelector('#win'),next=document.querySelector('#next'),lv=document.querySelector('#lv');function load(){tray.innerHTML='';box.innerHTML='';win.classList.remove('show');next.classList.remove('show');rot.classList.remove('show');lv.textContent=level+1;levels[level].forEach((name,i)=>{let o=catalog[name],e=document.createElement('div');e.className='item '+o.c;e.style.width=o.w+'px';e.style.height=o.h+'px';e.style.left=(7+i*(84/levels[level].length))+'%';e.style.top=(10+(i%2)*40)+'%';tray.appendChild(e);drag(e)})}function overlap(a,b){return !(a.right<=b.left+3||a.left>=b.right-3||a.bottom<=b.top+3||a.top>=b.bottom-3)}function valid(e){let r=e.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.left<b.left||r.right>b.right||r.top<b.top||r.bottom>b.bottom)return false;return ![...box.querySelectorAll('.item')].some(x=>x!==e&&overlap(r,x.getBoundingClientRect()))}function drag(e){let active=false,dx=0,dy=0,home;e.onpointerdown=p=>{sel=e;rot.classList.add('show');active=true;e.setPointerCapture(p.pointerId);let r=e.getBoundingClientRect();dx=p.clientX-r.left;dy=p.clientY-r.top;home={parent:e.parentNode,left:e.style.left,top:e.style.top};e.classList.add('drag');e.style.position='fixed';e.style.zIndex=20};e.onpointermove=p=>{if(active){e.style.left=p.clientX-dx+'px';e.style.top=p.clientY-dy+'px'}};e.onpointerup=()=>{if(!active)return;active=false;e.classList.remove('drag');if(valid(e)){let r=e.getBoundingClientRect(),b=box.getBoundingClientRect();box.appendChild(e);e.style.position='absolute';e.style.left=r.left-b.left+'px';e.style.top=r.top-b.top+'px';e.style.zIndex=2;if(navigator.vibrate)navigator.vibrate(30);check()}else{home.parent.appendChild(e);e.style.position='absolute';e.style.left=home.left;e.style.top=home.top;e.style.zIndex='';if(navigator.vibrate)navigator.vibrate(8)}}}rot.onclick=()=>{if(!sel)return;let w=sel.offsetWidth,h=sel.offsetHeight;sel.style.width=h+'px';sel.style.height=w+'px';check()};function check(){let all=[...document.querySelectorAll('.item')];if(all.length&&all.every(e=>e.parentNode===box&&valid(e))){win.classList.add('show');next.classList.add('show');rot.classList.remove('show');if(navigator.vibrate)navigator.vibrate([25,30,55])}}next.onclick=()=>{level=(level+1)%levels.length;load()};load()</script></body></html>
